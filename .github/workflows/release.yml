name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild and Windows SDK Tools
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: dotnet restore Klyro.sln

      - name: Run Test Suites
        run: dotnet test Klyro.sln -c Release --no-restore --verbosity normal

      - name: Publish WinUI 3 Application (win-x64 Self-Contained)
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "${{ github.event.inputs.version }}" }
          dotnet publish src/Klyro.App/Klyro.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:PublishSingleFile=false -p:Version=$ver -o output/Klyro-win-x64

      - name: Create Release Zip Archive
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v${{ github.event.inputs.version }}" }
          Compress-Archive -Path output/Klyro-win-x64/* -DestinationPath "output/Klyro-$ver-win-x64.zip" -Force
          Get-FileHash -Path "output/Klyro-$ver-win-x64.zip" -Algorithm SHA256 | Out-File "output/Klyro-$ver-win-x64.zip.sha256"

      - name: Build Standalone Windows x64 Setup Executable
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "${{ github.event.inputs.version }}" }
          $resourcesDir = "src/Klyro.Installer/Resources"
          if (-not (Test-Path $resourcesDir)) { New-Item -Path $resourcesDir -ItemType Directory -Force }
          Compress-Archive -Path output/Klyro-win-x64/* -DestinationPath "$resourcesDir/app.payload.zip" -Force -CompressionLevel Fastest
          dotnet publish src/Klyro.Installer/Klyro.Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=$ver -o output/installer-build
          Move-Item -Path output/installer-build/Klyro.Installer.exe -Destination "output/Klyro-Setup-v$ver-win-x64.exe" -Force
          Copy-Item -Path "output/Klyro-Setup-v$ver-win-x64.exe" -Destination "output/Klyro-Setup-x64.exe" -Force
          Get-FileHash -Path "output/Klyro-Setup-v$ver-win-x64.exe" -Algorithm SHA256 | Out-File "output/Klyro-Setup-v$ver-win-x64.exe.sha256"

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            output/Klyro-Setup-*.exe
            output/Klyro-Setup-*.exe.sha256
            output/Klyro-*.zip
            output/Klyro-*.zip.sha256
            output/Klyro-win-x64/Klyro.App.exe
          draft: false
          prerelease: false
          generate_release_notes: true
